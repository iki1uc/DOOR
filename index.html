<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>DOOR · Übergangsmodul</title>
<style>
    body { background:#111; color:#eee; font-family:Arial; padding:20px; }
    button { padding:10px 20px; margin:5px; background:#333; color:#fff; border:1px solid #555; }
    #log { margin-top:20px; padding:10px; background:#222; border:1px solid #444; }
</style>
</head>
<body>

<h1>DOOR – Übergangsmodul</h1>
<p>Status wird live angezeigt.</p>

<button onclick="enableDOO()">DOO aktivieren</button>
<button onclick="openDOOR()">DOOR öffnen</button>
<button onclick="mapping()">Mapping‑Übergang erzeugen</button>
<button onclick="apiPass()">API‑Durchlass testen</button>

<div id="log">System bereit.</div>

<script>
// --- Vorläufiges Systemobjekt ---
const System = {
    state: "idle",
    controller: false,
    transition: false
};

// --- DOO: Controller ---
function enableDOO() {
    System.controller = true;
    System.state = "control-ready";
    log("DOO aktiviert → Kontrolle bereit.");
}

// --- DOOR: Übergang ---
function openDOOR() {
    if (!System.controller) {
        System.transition = true;
        System.state = "tmp-transition";
        log("DOOR geöffnet (tmp) → Übergang ohne Kontrolle.");
        return;
    }
    System.transition = true;
    System.state = "stable-transition";
    log("DOOR stabil geöffnet → Kontrolle aktiv.");
}

// --- GEO/PHYSIK Mapping ---
function mapping() {
    if (!System.transition) {
        System.transition = true;
        System.state = "mapped-transition";
        log("Mapping‑Übergang erzeugt → Übergang wo keiner war.");
        return;
    }
    log("Mapping nicht nötig → Übergang bereits aktiv.");
}

// --- API Durchlass ---
function apiPass() {
    if (!System.transition) {
        log("API blockiert → kein Übergang aktiv.");
        return;
    }
    log("API durchgelassen → Datenfluss aktiv.");
}

// --- Log-Ausgabe ---
function log(msg) {
    document.getElementById("log").innerHTML = msg;
}
</script>

</body>
</html>
